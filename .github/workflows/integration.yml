name: Real Jellyfin integration

'on':
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: real-jellyfin-integration
  cancel-in-progress: false

jobs:
  real-server-rigs:
    name: Jellyfin 10.11/12 lifecycle, host-upgrade, and proxy rigs
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: plugin/Jellyfin.Plugin.RefreshKit/packages.lock.json

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      # The dual-Jellyfin lab synthesizes playback media on the host
      # (e2e/jellyfin/run.sh rk_requires ffmpeg); the hosted runner image does
      # not provide it. The in-place host-upgrade leg, which needs it too, is
      # not invoked by the integration gate while its harness is being repaired
      # (see the note in test.sh's test_integration).
      - name: Install ffmpeg for the lab media fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run the disposable real-server suite
        env:
          RK_RESULTS_DIR: test-results/integration
        run: ./test.sh integration

      - name: Preserve browser failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          output = Path('test-results/integration/failure-diagnostics')
          output.mkdir(parents=True, exist_ok=True)
          for target in ('jf10', 'jf12'):
              source = Path('e2e/jellyfin/artifacts') / target / 'browser/result.json'
              if source.exists():
                  result = json.loads(source.read_text())
                  # browser.cjs already redacts these records. Deliberately
                  # retain only the error audit, not raw network captures.
                  diagnostic = {key: result.get(key) for key in
                                ('target', 'failures', 'errorAudit', 'restartWindow')}
                  (output / (target + '.json')).write_text(json.dumps(diagnostic, indent=2))
          PY

      - name: Retain Enhanced adoption evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enhanced-adoption-${{ github.sha }}-${{ github.run_attempt }}
          path: e2e/enhanced/artifacts/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-jellyfin-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/integration
          if-no-files-found: error
          retention-days: 14
