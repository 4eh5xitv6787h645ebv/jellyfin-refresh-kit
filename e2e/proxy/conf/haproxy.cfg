global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout tunnel  1h

frontend jellyfin_front
    bind *:80
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port  80
    default_backend jellyfin_back

backend jellyfin_back
    option httpchk GET /System/Info/Public
    server jellyfin rk-jf:8096 check
