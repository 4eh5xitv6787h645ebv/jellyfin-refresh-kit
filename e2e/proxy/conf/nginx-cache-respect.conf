proxy_cache_path /var/cache/nginx/jf2 levels=1:2 keys_zone=jfcache2:10m max_size=200m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://rk-jf:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_cache jfcache2;
        proxy_cache_valid 200 10m;
        # No proxy_ignore_headers: the origin's Cache-Control: no-cache wins.
        # nginx proxy_cache still consumes client conditional headers itself;
        # this setup proves freshness, not end-to-end 304/412 preservation.
        proxy_cache_revalidate on;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
map $http_upgrade $http_connection { default upgrade; "" close; }
