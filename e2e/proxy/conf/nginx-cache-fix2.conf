proxy_cache_path /var/cache/nginx/jf4 levels=1:2 keys_zone=jfcache4:10m max_size=200m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Remedy 2: never cache the validator-sensitive app shell or kit endpoints.
    # Their client conditionals therefore reach the origin and preserve the
    # strict 304/412 contract; other paths retain remedy 1's fresh proxy_cache.
    location = /web/            { proxy_cache off; include /etc/nginx/rk_proxy.inc; }
    location = /web/index.html  { proxy_cache off; include /etc/nginx/rk_proxy.inc; }
    location /RefreshKit/       { proxy_cache off; include /etc/nginx/rk_proxy.inc; }

    location / {
        include /etc/nginx/rk_proxy.inc;
        proxy_cache jfcache4;
        proxy_cache_valid 200 10m;
        proxy_ignore_headers Set-Cookie X-Accel-Expires;
        proxy_cache_revalidate on;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
map $http_upgrade $http_connection { default upgrade; "" close; }
