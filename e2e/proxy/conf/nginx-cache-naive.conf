proxy_cache_path /var/cache/nginx/jf levels=1:2 keys_zone=jfcache:10m max_size=200m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://rk-jf:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # THE MISCONFIGURATION: cache 200s for 10m and throw away everything
        # the origin said about freshness.
        proxy_cache jfcache;
        proxy_cache_valid 200 10m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
map $http_upgrade $http_connection { default upgrade; "" close; }
