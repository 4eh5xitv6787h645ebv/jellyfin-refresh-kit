# Disposable, project-scoped Jellyfin compatibility lab.
#
# Always invoke this file through ./run.sh (or pass --project-name yourself).
# There are deliberately no container_name entries, bind-mounted user configs,
# or externally named volumes/networks: Compose owns every resource it creates.

services:
  repository:
    image: busybox@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
    profiles: ["lifecycle"]
    command: ["httpd", "-f", "-p", "8080", "-h", "/repository"]
    user: "65534:65534"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./.state/repository:/repository:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health.txt"]
      interval: 2s
      timeout: 2s
      retries: 30

  jf10:
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    ports:
      - "127.0.0.1:${RK_JF10_PORT:-18116}:8096"
    volumes:
      - jf10-config:/config
      - jf10-cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/System/Info/Public >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 80
    stop_grace_period: 20s

  jf12:
    image: jellyfin/jellyfin:12.0-rc4@sha256:db1df1d111c27ba1f10bb8fce6630892f66eb66b12c2b24e79011453ac18b3db
    ports:
      - "127.0.0.1:${RK_JF12_PORT:-18117}:8096"
    volumes:
      - jf12-config:/config
      - jf12-cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/System/Info/Public >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 80
    stop_grace_period: 20s

  # A separate service/volume pair is used for destructive in-place host
  # upgrade tests.  The runner accepts only its hard-coded digest-pinned image
  # sequence; the default merely keeps ordinary Compose parsing deterministic.
  host-upgrade:
    image: ${RK_HOST_UPGRADE_IMAGE:-jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db}
    profiles: ["host-upgrade"]
    ports:
      - "127.0.0.1:${RK_HOST_UPGRADE_PORT:-18118}:8096"
    volumes:
      - host-upgrade-config:/config
      - host-upgrade-cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/System/Info/Public >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 160
    stop_grace_period: 30s

volumes:
  jf10-config:
  jf10-cache:
  jf12-config:
  jf12-cache:
  host-upgrade-config:
  host-upgrade-cache:
